# URLs search engines may still know from older versions of pcesports.com (docs/old-urls.md has the list, its
# sources and the reasons). Included by nginx.prod.conf inside the www server.
# A URL whose topic lives on in a page 301s there; one whose content is gone for good answers 410 Gone, so search
# engines drop it, with the 404 page as its body. Anything not listed gets the normal 404.
# A later page that reuses one of these paths must take its line out first: a location here wins over location /.

# The event listings, per game and overall: the home page ("What should I watch?") took their place
location ~ ^/events/?$ {
	return 301 https://www.pcesports.com/;
}

location ~ ^/events/(counter-strike|dota|hearthstone|heroes-of-the-storm|league-of-legends|overwatch|rocket-league|smite)/?$ {
	return 301 https://www.pcesports.com/;
}

# The 2014-2016 site's home and its listings of tournaments and live streams
location ~ ^/(en|ru)/?$ {
	return 301 https://www.pcesports.com/;
}

location ~ ^/en/(tournaments|streams)(/.*)?$ {
	return 301 https://www.pcesports.com/;
}

# Gone for good: single events, user and member profiles, teams, articles, blogs, news, boards, the old game pages,
# the old sites' files and the old API's addresses
location /events/ {
	return 410;
}

location /user/ {
	return 410;
}

location /article/ {
	return 410;
}

location ~ ^/blog(/.*)?$ {
	return 410;
}

location /en/ {
	return 410;
}

location /ru/ {
	return 410;
}

location /web/ {
	return 410;
}

location /dist/ {
	return 410;
}

location /assets/ {
	return 410;
}

location ~ ^/(api|wp-api|images)(/.*)?$ {
	return 410;
}
