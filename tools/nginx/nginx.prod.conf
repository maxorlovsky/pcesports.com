# https://www.pcesports.com, a static site (README.md, "Deploy"): nginx serves `site/` in the live clone,
# /var/www/pcesports.com, a link to the newest build in `.releases/` that `npm run deploy` moves in one step.
# /etc/nginx/sites-enabled/pcesports.com is a symlink to this file in that clone, which stays on master: never move,
# rename or delete it, since nginx then refuses every reload (certbot's renewals included).
# www is the canonical host: the bare domain and plain HTTP redirect to it.
# No server block keeps an access log, as the privacy page says (app/pages/privacy.vue). nginx's error log can still
# name an address when a request fails, as the page says too.

server {
	listen 80;
	listen [::]:80;

	server_name pcesports.com www.pcesports.com;
	access_log off;

	# Let's Encrypt's HTTP challenge, for a certificate renewed with the webroot method. certbot (root) writes into
	# `acme`, its webroot, which no deploy touches: a root-owned folder inside a release would stop the deploy that
	# prunes that release (README.md, "On max-cloud")
	location ^~ /.well-known/acme-challenge/ {
		root /var/www/pcesports.com/acme;
		try_files $uri =404;
	}

	location / {
		return 301 https://www.pcesports.com$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name pcesports.com;
	access_log off;

	# TLS, the same in both HTTPS blocks and on every other site on the server's port 443: sites on one port can break
	# each other's handshakes, so a value changes only together with all of them (README.md, "On max-cloud";
	# `npm run nginx:test` holds ssl_protocols to the agreed line). Set here, in each block, never in a shared snippet
	# or outside a server block: nginx includes this file at its http level, where a setting would reach every site.
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_prefer_server_ciphers on;
	ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:ECDHE-RSA-AES128-GCM-SHA256:AES256+EECDH:DHE-RSA-AES128-GCM-SHA256:AES256+EDH:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4";
	ssl_ecdh_curve secp384r1;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
	add_header X-Frame-Options DENY;
	add_header X-Content-Type-Options nosniff;

	ssl_certificate /etc/letsencrypt/live/pcesports.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pcesports.com/privkey.pem;

	return 301 https://www.pcesports.com$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name www.pcesports.com;
	access_log off;

	# TLS, the same as in the block above (see there)
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
	ssl_prefer_server_ciphers on;
	ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:ECDHE-RSA-AES128-GCM-SHA256:AES256+EECDH:DHE-RSA-AES128-GCM-SHA256:AES256+EDH:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA:ECDHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:ECDHE-RSA-DES-CBC3-SHA:EDH-RSA-DES-CBC3-SHA:AES256-GCM-SHA384:AES128-GCM-SHA256:AES256-SHA256:AES128-SHA256:AES256-SHA:AES128-SHA:DES-CBC3-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!MD5:!PSK:!RC4";
	ssl_ecdh_curve secp384r1;
	ssl_session_cache shared:SSL:10m;
	ssl_session_tickets off;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	add_header Strict-Transport-Security "max-age=63072000; includeSubdomains";
	add_header X-Frame-Options DENY;
	add_header X-Content-Type-Options nosniff;

	ssl_certificate /etc/letsencrypt/live/pcesports.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pcesports.com/privkey.pem;

	root /var/www/pcesports.com/site;
	charset utf-8;

	gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;
	gzip_vary on;

	# The 404 page `nuxt generate` renders; old URLs that are gone for good answer 410 with the same page
	error_page 404 410 /404.html;

	location = /404.html {
		internal;
	}

	# Nuxt's single-page fallback, which a static site never uses, and the addresses `try_files` would give the
	# fallback, the 404 page and the home page besides their own
	location = /200.html {
		return 404;
	}

	location ~ ^/(200|404|index)$ {
		return 404;
	}

	# One address per page: /index.html and /privacy.html answer at / and /privacy
	location = /index.html {
		rewrite ^ https://www.pcesports.com/ permanent;
	}

	# `rewrite`, not `return`: it escapes what it copies from the address (a %0D stays %0D, never a header break) and
	# keeps the query string
	location ~ ^/(.+)\.html$ {
		rewrite ^/(.+)\.html$ https://www.pcesports.com/$1 permanent;
	}

	location = / {
		try_files /index.html =404;
	}

	# A page is `<name>.html` (nuxt.config.ts, autoSubfolderIndex), served at /<name>; /<name>/ redirects there
	location / {
		rewrite ^/(.+)/$ https://www.pcesports.com/$1 permanent;
		try_files $uri $uri.html =404;
	}

	# Nuxt names what it builds in _nuxt/ by its content, so a deploy never changes those files: kept a year. The
	# one exception, builds/latest.json, is always fetched with a fresh query string, so its year does no harm.
	# (`expires`, not add_header: a location with an add_header of its own drops the server block's three headers.)
	location ^~ /_nuxt/ {
		expires 1y;
		try_files $uri =404;
	}

	# URLs of older versions of the site: 301s to a page that took their place, 410s for the rest (docs/old-urls.md)
	include /var/www/pcesports.com/tools/nginx/old-urls.conf;
}
